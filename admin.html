<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#05070f">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head><body class="adm">
<div id="setup" class="notice" hidden>Supabase is not configured. Fill in <code>js/config.js</code> (see README).</div>
<section id="login" class="login" hidden>
  <form id="login-form" class="card" novalidate>
    <h1>Admin sign in</h1>
    <label class="fld">Email<input name="email" type="email" autocomplete="username" required></label>
    <label class="fld">Password<input name="password" type="password" autocomplete="current-password" required></label>
    <div class="err" id="login-err" hidden></div>
    <button class="btn" type="submit">Sign in</button>
    <a href="index.html" class="mut">Back to the site</a>
  </form>
</section>
<div id="shell" class="shell" hidden>
  <aside class="side"><div class="brand">Admin</div><nav id="anav"></nav>
    <div class="sidefoot"><a href="index.html" target="_blank" rel="noopener">View site</a><button id="logout" class="linkbtn">Sign out</button></div></aside>
  <main class="amain"><div id="view"></div></main>
</div>
<dialog id="editor" class="ed"><div class="edh"><h2 id="editor-title"></h2><button class="x" data-close aria-label="Close">✕</button></div><div id="editor-body" class="pad"></div></dialog>
<dialog id="confirm"><form method="dialog" class="pad"><p id="confirm-msg"></p><div class="acts"><button class="btn ghost" value="no">Cancel</button><button class="btn danger" value="yes">Delete</button></div></form></dialog>
<script type="module" src="js/admin.js"></script>
</body></html>
